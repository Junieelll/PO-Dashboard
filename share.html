<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shared PO Data</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      colors: {
        bg: '#fafbff',
        surface: '#ffffff',
        'surface-2': '#f5f6fb',
        line: '#e2e4ef',
        txt: '#1a1c2e',
        'txt-2': '#5a5d78',
        'txt-3': '#93959f',
        accent: '#f472b6',
        'accent-2': '#ec4899',
        petal: '#fbbcd0',
      }
    }
  }
}
</script>
<style>
  :root {
    --bg: #fafbff;
    --surface: #ffffff;
    --surface-2: #f5f6fb;
    --line: #e2e4ef;
    --txt: #1a1c2e;
    --txt-2: #5a5d78;
    --txt-3: #93959f;
    --accent: #f472b6;
    --accent-2: #ec4899;
    --accent-glow: rgba(244, 114, 182, 0.3);
  }

  /* Sakura Petals */
  .petal-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; width: 12px; height: 12px;
    background: var(--petal, #fbbcd0);
    border-radius: 50% 0 50% 50%;
    opacity: 0; animation: petalFall linear infinite; filter: blur(0.5px);
  }
  @keyframes petalFall {
    0%   { opacity: 0; transform: translateY(-20px) rotate(0deg) scale(0.8); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.3); }
  }
  @keyframes fadeUp  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes rowIn   { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
  @keyframes spin    { to { transform: rotate(360deg); } }

  .anim-fadeUp { animation: fadeUp 0.5s ease-out; }
  .anim-rowIn  { animation: rowIn 0.3s ease-out both; }
  .anim-spin   { animation: spin 0.8s linear infinite; }

  /* ── Modern Tabs (Shared View) ── */
  .tabs-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    background: var(--surface-2);
    border-radius: 12px;
    width: max-content;
    max-width: 100%;
    border: 1px solid var(--line);
  }
  .po-waste-tab {
    position: relative;
    z-index: 2;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 700;
    color: var(--txt-3);
    border-radius: 9px;
    transition: color 0.3s ease;
    cursor: pointer;
    border: none;
    background: transparent;
    white-space: nowrap;
  }
  .po-waste-tab:hover { color: var(--txt); }
  .po-waste-tab.active { color: #fff !important; }

  .tab-pill {
    position: absolute;
    top: 4px;
    height: calc(100% - 8px);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 9px;
    z-index: 1;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 10px var(--accent-glow);
  }
</style>
</head>
<body class="font-sans bg-bg text-txt min-h-screen overflow-x-hidden antialiased">

<div class="petal-canvas" id="petals"></div>
<div class="relative z-10 max-w-[1000px] mx-auto py-10 px-6 anim-fadeUp" id="content">
  <div class="flex flex-col items-center justify-center min-h-[60vh] text-center gap-3">
    <div class="w-8 h-8 border-[3px] border-line border-t-accent rounded-full anim-spin"></div>
    <p class="text-txt-2 text-[13px]">Loading shared data…</p>
  </div>
</div>

<script>
// Sakura Petals
(function initPetals() {
  const canvas = document.getElementById('petals');
  const COUNT = 30;
  for (let i = 0; i < COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 6 + Math.random() * 12;
    const hue = 330 + Math.random() * 20;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      width: ${size}px; height: ${size}px;
      background: hsl(${hue}, 80%, ${75 + Math.random() * 15}%);
      animation-duration: ${8 + Math.random() * 12}s;
      animation-delay: ${Math.random() * 15}s;
      opacity: 0;
    `;
    canvas.appendChild(p);
  }
})();

// Load Data
(async function load() {
  const token = new URLSearchParams(location.search).get('token');
  const wrap = document.getElementById('content');

  if (!token) {
    wrap.innerHTML = renderError('No Token', 'No share token provided in URL.');
    return;
  }

  try {
    const res = await fetch(`/share/view/${token}`);
    const data = await res.json();

    if (!res.ok) {
      wrap.innerHTML = renderError(
        res.status === 404 ? 'Not Found' : 'Expired',
        data.error || 'This link is no longer available.'
      );
      return;
    }

    const pos = data.purchaseOrders || [];
    const rows = data.cellData || [];
    const activeTabs = {};
    const poRegistry = {}; 

    pos.forEach(p => {
      if (!poRegistry[p.po_number]) poRegistry[p.po_number] = [];
      poRegistry[p.po_number].push(p);
    });

    const uniquePOs = Object.keys(poRegistry);
    uniquePOs.forEach(po => {
      activeTabs[po] = poRegistry[po][0]?.waste_description || '';
    });

    function updateTabPill(poNum) {
      const card = document.querySelector(`.po-card[data-po="${poNum}"]`);
      if (!card) return;
      const activeBtn = card.querySelector('.po-waste-tab.active');
      const pill = card.querySelector('.tab-pill');
      if (activeBtn && pill) {
        pill.style.width = `${activeBtn.offsetWidth}px`;
        pill.style.left = `${activeBtn.offsetLeft}px`;
      }
    }

    function buildPOCardHtml(po) {
      const activeWD = activeTabs[po];
      const poInfo = poRegistry[po].find(p => p.waste_description === activeWD) || poRegistry[po][0];
      const entries = rows.filter(r => r.po_number === po && r.waste_description === activeWD);
      
      const startQty = parseFloat(String(poInfo.starting_qty || '0').replace(/,/g,'')) || 0;
      const totalUsed = entries.reduce((s, r) => s + (parseFloat(String(r.quantity||'0').replace(/,/g,''))||0), 0);
      const balance = parseFloat(String(entries[entries.length - 1]?.running_balance||'0').replace(/,/g,'')) || 0;
      
      const pctUsed = startQty > 0 ? Math.min(100, Math.round((totalUsed / startQty) * 100)) : 0;
      const pctLeft = 100 - pctUsed;
      const barColor = pctUsed >= 90 ? '#ef4444' : pctUsed >= 70 ? '#f59e0b' : '#22c55e';
      const balColor = pctUsed >= 90 ? 'text-red-500' : pctUsed >= 70 ? 'text-amber-500' : 'text-emerald-500';

      const wasteDescs = poRegistry[po].map(p => p.waste_description);

      return `
      <div class="bg-surface border border-line rounded-[20px] overflow-hidden shadow-sm hover:border-pink-200 transition-colors po-card" data-po="${esc(po)}">
        <div class="px-5 py-4 bg-gradient-to-r from-pink-50/50 to-transparent border-b border-line flex flex-wrap items-center justify-between gap-2">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] text-white font-bold bg-rose-400 px-2 py-0.5 rounded uppercase tracking-wider">P.O. NUMBER</span>
              <h3 class="font-bold text-txt text-[16px] tracking-tight">${esc(po)}</h3>
            </div>
            <div class="text-[12px] text-accent mt-1.5 font-bold flex items-center gap-2 bg-accent/5 px-2.5 py-1 rounded-lg border border-accent/10 w-fit">
              <span class="inline-block w-2 h-2 rounded-full bg-accent animate-pulse"></span>
              ${esc(activeWD || 'Default').toUpperCase()}
            </div>
          </div>
          <span class="text-[11px] font-semibold text-txt-3 uppercase tracking-wider bg-surface border border-line px-2.5 py-1 rounded-md shadow-sm">${entries.length} records</span>
        </div>

        <!-- Animated Tabs -->
        ${wasteDescs.length > 1 ? `
        <div class="px-5 py-3 bg-surface border-b border-line overflow-x-auto">
          <div class="tabs-container">
            <div class="tab-pill"></div>
            ${wasteDescs.map(wd => {
              const pi = poRegistry[po].find(p => p.waste_description === wd);
              const label = (pi?.tab_name || wd || 'Default').trim();
              const isActive = wd === activeWD;
              return `<button class="po-waste-tab ${isActive ? 'active' : ''}" data-po="${esc(po)}" data-wd="${esc(wd)}">${esc(label)}</button>`;
            }).join('')}
          </div>
        </div>
        ` : ''}

        <!-- Stats Row -->
        ${startQty > 0 ? `
        <div class="grid grid-cols-3 divide-x divide-line border-b border-line">
          <div class="px-4 py-4 text-center">
            <div class="text-[10px] font-semibold text-txt-3 uppercase tracking-widest mb-1">Starting Qty</div>
            <div class="text-[18px] font-bold text-txt tabular-nums">${startQty.toLocaleString('en-US',{minimumFractionDigits:2})}</div>
          </div>
          <div class="px-4 py-4 text-center">
            <div class="text-[10px] font-semibold text-txt-3 uppercase tracking-widest mb-1">Total Hauled</div>
            <div class="text-[18px] font-bold text-txt tabular-nums">${totalUsed.toLocaleString('en-US',{minimumFractionDigits:2})}</div>
          </div>
          <div class="px-4 py-4 text-center">
            <div class="text-[10px] font-semibold text-txt-3 uppercase tracking-widest mb-1">Balance</div>
            <div class="text-[20px] font-extrabold tabular-nums ${balColor}">${balance.toLocaleString('en-US',{minimumFractionDigits:2})}</div>
          </div>
        </div>
        <div class="px-5 py-3 border-b border-line">
          <div class="flex justify-between text-[11px] font-medium mb-1.5">
            <span class="text-txt-3">${pctUsed}% consumed</span>
            <span style="color:${barColor};" class="font-semibold">${pctLeft}% remaining</span>
          </div>
          <div class="w-full h-2 bg-line rounded-full overflow-hidden">
            <div class="h-2 rounded-full transition-all duration-700" style="width:${pctUsed}%;background:${barColor};"></div>
          </div>
        </div>` : ''}

        <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
          <table class="w-full border-collapse tabular-nums">
            <thead class="sticky top-0 z-20"><tr>
              ${data.columns.map(c => `<th class="py-3 px-4 text-[11px] font-semibold text-txt-3 uppercase tracking-[0.5px] text-left border-b border-line whitespace-nowrap bg-surface-2 ${c.type === 'number' ? '!text-right' : ''}">${esc(c.label)}</th>`).join('')}
            </tr></thead>
            <tbody>
              ${entries.length === 0 ? `<tr><td colspan="${data.columns.length}" class="py-10 text-center text-txt-3 text-xs italic">No hauling entries recorded for this category.</td></tr>` : ''}
              ${entries.map((row, ri) => `<tr class="anim-rowIn hover:bg-pink-50/60 transition-colors" style="animation-delay:${ri*0.01}s">
                ${data.columns.map(c => {
                  const v = row[c.id] ?? '';
                  const isNum = c.type === 'number';
                  const display = isNum && v ? Number(String(v).replace(/,/g,'')).toLocaleString('en-US', {minimumFractionDigits:2}) : v;
                  return `<td class="py-3 px-4 border-b border-line text-[13px] text-txt-2 ${isNum ? '!text-right font-medium text-txt' : ''}">${esc(display)}</td>`;
                }).join('')}
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    function bindPOCardEvents(card) {
      const poNum = card.dataset.po;
      card.querySelectorAll('.po-waste-tab').forEach(btn => {
        btn.onclick = () => {
          const wd = btn.dataset.wd;
          if (activeTabs[poNum] === wd) return;
          activeTabs[poNum] = wd;
          
          // Partial Update: Only update this card's content
          card.outerHTML = buildPOCardHtml(poNum);
          const newCard = document.querySelector(`.po-card[data-po="${poNum}"]`);
          bindPOCardEvents(newCard);
          setTimeout(() => updateTabPill(poNum), 0);
        };
      });
      setTimeout(() => updateTabPill(poNum), 0);
    }

    wrap.innerHTML = `
    <div class="bg-surface border border-line rounded-2xl overflow-hidden shadow-xl anim-fadeUp">
      <div class="relative py-10 px-8 flex flex-col justify-end min-h-[170px] bg-pink-100 overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-1000 scale-105" style="background-image: url('sakura.png')"></div>
        <div class="absolute inset-0 bg-gradient-to-tr from-pink-600/90 via-pink-500/70 to-pink-300/40 mix-blend-multiply pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-pink-950/60 to-transparent pointer-events-none"></div>
        <div class="relative z-10 drop-shadow-md mt-4">
          <h1 class="text-[30px] font-800 tracking-tight text-white flex items-center gap-3">
            <span class="text-pink-200 inline-flex items-center">
              <svg class="w-8 h-8 drop-shadow-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
            </span>
            ${esc(data.label || data.sheetName)}
          </h1>
          <div class="text-pink-100/95 text-[13px] mt-2 font-semibold tracking-wide drop-shadow flex items-center gap-2">
            <span>Shared by ${esc(data.owner)}</span>
            <span class="w-1 h-1 rounded-full bg-pink-200 opacity-50"></span>
            <span>${uniquePOs.length} Purchase Orders</span>
          </div>
        </div>
      </div>

      <div class="p-6 flex flex-col gap-8 bg-surface-2/40" id="cards-container">
        ${uniquePOs.length === 0 ? '<div class="text-center py-10 text-txt-3 text-sm">No entries available.</div>' : ''}
        ${uniquePOs.map(po => buildPOCardHtml(po)).join('')}
      </div>

      <div class="py-5 px-8 border-t border-line text-center text-[11px] font-bold text-txt-3 bg-surface flex flex-wrap items-center justify-between gap-4 uppercase tracking-widest">
        <div>Generated ${new Date(data.sharedAt).toLocaleString()}</div>
        ${data.expiresAt ? `<div class="text-rose-400">Expires ${new Date(data.expiresAt).toLocaleString()}</div>` : ''}
      </div>
    </div>`;

    // Initialize Card Events
    document.querySelectorAll('.po-card').forEach(card => bindPOCardEvents(card));

  } catch (err) {
    console.error(err);
    wrap.innerHTML = renderError('Connection Error', 'Could not reach the server.');
  }
})();

function renderError(title, msg) {
  return `<div class="flex flex-col items-center justify-center min-h-[60vh] text-center gap-3 anim-fadeUp">
    <svg class="w-12 h-12 text-txt-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h2 class="text-lg font-bold">${title}</h2>
    <p class="text-txt-2 text-[13px]">${msg}</p>
  </div>`;
}

function esc(s) { 
  const d = document.createElement('span'); 
  d.textContent = s ?? ''; 
  return d.innerHTML.replace(/'/g, '&apos;').replace(/"/g, '&quot;'); 
}
</script>
</body>
</html>
